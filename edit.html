<!DOCTYPE html>
<html>

<head>

<title>Edit Result</title>

<style>

body{
    background:#f2f2f2;
    font-family:Arial;
}

.container{
    width:90%;
    max-width:500px;
    background:white;
    margin:auto;
    margin-top:40px;
    padding:20px;
    border-radius:10px;
}

input{
    width:100%;
    padding:10px;
    margin-top:10px;
}

button{
    width:100%;
    padding:10px;
    margin-top:15px;
    background:darkblue;
    color:white;
    border:none;
}

</style>

</head>

<body>

<div class="container">

<h2>Edit Result</h2>

<form method="POST">

<input type="text"
name="subject"
value="{{ result[2] }}">

<input type="text"
name="grade"
value="{{ result[3] }}">

<button type="submit">
Update Result
</button>

</form>

</div>

</body>
</html>
