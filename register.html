<!DOCTYPE html>
<html>

<head>

<title>Student Registration</title>

<style>

body{
    background:#f2f2f2;
    font-family:Arial;
}

.container{
    width:90%;
    max-width:500px;
    background:white;
    margin:auto;
    margin-top:40px;
    padding:20px;
    border-radius:10px;
    box-shadow:0px 0px 10px gray;
}

h2{
    text-align:center;
    color:darkblue;
}

input{
    width:100%;
    padding:10px;
    margin-top:10px;
}

button{
    width:100%;
    padding:10px;
    margin-top:15px;
    background:darkblue;
    color:white;
    border:none;
}

</style>

</head>

<body>

<div class="container">

<h2>Student Registration</h2>

<form method="POST">

<input type="text"
name="exam_number"
placeholder="Exam Number"
required>

<input type="text"
name="fullname"
placeholder="Full Name"
required>

<input type="password"
name="password"
placeholder="Password"
required>

<button type="submit">
Register Student
</button>

</form>

</div>

</body>
</html>
